<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you, my love ♡</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120b1f">
<meta property="og:title" content="Something is waiting for you ♡">
<meta property="og:description" content="Opens at midnight · November 29">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#f4a7b9; --rose-deep:#e46a8c; --gold:#f6d7a7;
    --ink:#fbeff2; --muted:rgba(251,239,242,.62); --line:rgba(244,167,185,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100svh; color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:300;
    background:
      radial-gradient(ellipse 90% 55% at 50% 115%, rgba(228,106,140,.35) 0%, transparent 70%),
      linear-gradient(180deg,#0b0716 0%,#170e27 55%,#2a1236 100%);
    background-attachment:fixed;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #sky{z-index:0} #fx{z-index:5} #fw{z-index:6}

  /* flower field that rises at the bottom of the screen */
  .field{position:fixed;left:0;right:0;bottom:0;height:46svh;z-index:1;pointer-events:none;
    background:center 78%/cover no-repeat;
    -webkit-mask-image:linear-gradient(to top,#000 42%,transparent);mask-image:linear-gradient(to top,#000 42%,transparent);
    opacity:0;transform:translateY(60px);filter:brightness(.9) saturate(1.05);
    transition:opacity 2.4s ease, transform 2.6s cubic-bezier(.2,.8,.2,1)}
  .field.show{opacity:1;transform:none}

  /* 🎉 party poppers in the bottom corners */
  .popper{position:fixed;top:calc(50% - 40px);z-index:7;pointer-events:none;
    font-size:clamp(54px,15vw,84px);line-height:1;opacity:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  .popper.l{left:10px} .popper.r{right:10px}
  .popper .in{display:block}
  .popper.r .in{transform:scaleX(-1)}
  .popper.show{animation:popIn .45s cubic-bezier(.3,1.7,.5,1) forwards}
  .popper.fire .in{animation:recoil .35s ease-out}
  .popper.r.fire .in{animation:recoilR .35s ease-out}
  .popper.bye{animation:popOut .8s ease forwards}
  @keyframes popIn{from{opacity:0;transform:translateY(40px) scale(.4)}to{opacity:1;transform:none}}
  @keyframes popOut{from{opacity:1}to{opacity:0;transform:translateY(30px) scale(.8)}}
  @keyframes recoil{0%{transform:none}30%{transform:translate(-6px,8px) scale(.9) rotate(-8deg)}100%{transform:none}}
  @keyframes recoilR{0%{transform:scaleX(-1)}30%{transform:scaleX(-1) translate(-6px,8px) scale(.9) rotate(-8deg)}100%{transform:scaleX(-1)}}

  .stage{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;
    padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}

  .serif{font-family:"Cormorant Garamond",Georgia,serif}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--rose);font-weight:400}

  /* ---------- Locked ---------- */
  .locked{width:100%;max-width:560px;text-align:center;transition:opacity .9s ease, transform .9s ease, filter .9s ease}
  .locked.leaving{opacity:0;transform:scale(.96);filter:blur(6px)}
  .lock{width:68px;height:76px;color:var(--rose);margin:0 auto 26px;display:block;
    filter:drop-shadow(0 0 18px rgba(244,167,185,.45));animation:breathe 3.2s ease-in-out infinite}
  .lock .shackle{transform-box:view-box;transform-origin:46px 32px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
  .lock.open .shackle{transform:translateY(-7px) rotate(-22deg)}
  .lock.open{animation:none;filter:drop-shadow(0 0 34px rgba(246,215,167,.9));color:var(--gold);transition:color .6s, filter .6s}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-style:italic;
    font-size:clamp(34px,8.4vw,58px);line-height:1.08;margin:14px 0 30px;letter-spacing:-.01em}

  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.4vw,14px);margin:0 auto 26px}
  .unit{border:1px solid var(--line);border-radius:18px;padding:18px 4px 13px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .num{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
    font-size:clamp(38px,11vw,64px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
  .num.tick{animation:tick .45s ease-out}
  @keyframes tick{from{opacity:.25;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .lbl{display:block;margin-top:8px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .when{font-size:14px;color:var(--muted);line-height:1.7}
  .when b{color:var(--ink);font-weight:400}
  .hint{margin-top:26px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px;color:var(--rose);opacity:.85}
  .loading .countdown, .loading .when{opacity:0}
  .countdown,.when{transition:opacity .5s}

  /* ---------- Revealed ---------- */
  .revealed{width:100%;max-width:720px;text-align:center;padding-bottom:26svh}
  .stagger > *{opacity:0;transform:translateY(18px);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
  .stagger > *:nth-child(1){animation-delay:.1s}
  .stagger > *:nth-child(2){animation-delay:.35s}
  .stagger > *:nth-child(3){animation-delay:.6s}
  .stagger > *:nth-child(4){animation-delay:.95s}
  .stagger > *:nth-child(5){animation-delay:1.25s}
  .stagger > *:nth-child(6){animation-delay:1.5s}
  @keyframes rise{to{opacity:1;transform:none}}
  .leaving{opacity:0!important;transform:scale(.97)!important;filter:blur(6px);transition:opacity .8s ease, transform .8s ease, filter .8s ease}

  /* ---------- Flower quiz ---------- */
  .quiz{width:100%;max-width:560px;text-align:center;align-self:start;margin-top:5svh}
  .quiz h1{margin:12px 0 10px}
  .quiz .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,18px)}
  .choice{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;
    display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .6s, filter .6s, transform .3s}
  .choice:disabled{cursor:default}
  .choice .ph{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(0,0,0,.85);transition:box-shadow .6s, transform .6s}
  .choice img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
  .choice:not(:disabled):hover img,.choice:not(:disabled):focus-visible img{transform:scale(1.07)}
  .choice .nm{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:clamp(16px,4.3vw,21px);line-height:1.15}
  .choice.wrong{animation:shake .5s}
  .choice.wrong .ph::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(11,7,22,.6);font-size:30px;color:#fff}
  .choice.right .ph{transform:scale(1.06);box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(246,215,167,.75)}
  .choices.done .choice:not(.right){opacity:.22;filter:grayscale(1)}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}
    60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  .fb{min-height:2em;margin-top:26px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--rose)}
  .fb .yes{display:block;font-style:normal;font-weight:500;font-size:clamp(40px,11vw,64px);line-height:1.05;
    background:linear-gradient(100deg,var(--gold),#fff3e6,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
  .fb .yes-sub{display:block;margin-top:6px;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.6)}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .next{margin-top:24px;appearance:none;border:1px solid var(--gold);background:rgba(18,11,31,.55);color:var(--ink);
    border-radius:999px;padding:15px 30px;font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(246,215,167,.35);
    opacity:0;transform:translateY(10px);transition:opacity .8s ease, transform .8s ease}
  .next.show{opacity:1;transform:none}

  /* short screens (small phones, landscape): tighten the quiz so everything fits */
  @media (max-height:720px){
    .quiz{margin-top:1svh}
    .quiz h1{font-size:clamp(28px,7.4vw,44px);margin:8px 0 6px}
    .quiz .sub{margin-bottom:16px}
    .choice .ph{aspect-ratio:4/5}
    .fb{margin-top:14px}
    .fb .yes{font-size:clamp(34px,9.5vw,52px)}
    .next{margin-top:14px;padding:13px 26px}
  }
  @media (max-height:520px){
    .choices{max-width:420px;margin:0 auto}
  }

  .big{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1;font-variant-numeric:lining-nums;
    font-size:clamp(46px,12vw,92px);margin:14px 0 8px;letter-spacing:-.015em;
    background:linear-gradient(100deg,var(--gold) 0%,#fff3e6 35%,var(--rose) 70%,var(--gold) 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards, shimmer 6s linear 1.5s infinite}
  .big i{font-style:italic;font-weight:400}
  @keyframes shimmer{to{background-position:200% center}}
  .dates{font-size:13px;letter-spacing:.28em;color:var(--muted);margin-bottom:34px}
  .dates span{color:var(--rose);margin:0 .6em}

  .video{position:relative;display:block;width:100%;max-width:calc(82svh * 16 / 9);margin:0 auto;aspect-ratio:16/9;border-radius:20px;overflow:hidden;
    border:1px solid var(--line);background:#000;cursor:pointer;padding:0;color:inherit;font:inherit;
    box-shadow:0 30px 80px -20px rgba(228,106,140,.55),0 0 0 6px rgba(255,255,255,.03)}
  .video img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease, filter .6s}
  .video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(11,7,22,.75))}
  .video:hover img,.video:focus-visible img{transform:scale(1.04);filter:brightness(1.08)}
  .play{position:absolute;z-index:2;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.92);color:var(--rose-deep);
    box-shadow:0 0 0 0 rgba(255,255,255,.55);animation:ping 2.2s ease-out infinite}
  .play svg{width:30px;height:30px;margin-left:5px}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
  .video .cap{position:absolute;z-index:2;left:0;right:0;bottom:16px;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  .video.playing{cursor:default}
  .video.playing::after{display:none}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video.empty{display:grid;place-items:center;cursor:default;background:rgba(255,255,255,.04)}
  .video.empty::after{display:none}

  .yt{display:inline-block;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:2px}
  .yt:hover{color:var(--ink)}

  .letter{margin:44px auto 0;max-width:520px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
    font-size:clamp(19px,4.6vw,23px);line-height:1.65;white-space:pre-line;color:#f7e4ea;
    padding:28px 22px;border-radius:22px;border:1px solid var(--line);
    background:rgba(18,11,31,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .sign{margin-top:22px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose)}

</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="field" id="field" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<canvas id="fw"></canvas>

<main class="stage" id="stage">
  <section class="locked loading" id="locked" aria-live="polite">
    <svg class="lock" id="lock" viewBox="0 0 64 76" aria-hidden="true">
      <path class="shackle" d="M18 32V22a14 14 0 0 1 28 0v10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <rect x="8" y="30" width="48" height="42" rx="11" fill="currentColor"/>
      <path d="M32 61s-9.5-5.8-9.5-11.8A5 5 0 0 1 32 46.3a5 5 0 0 1 9.5 2.9C41.5 55.2 32 61 32 61z" fill="#1a0f2a"/>
    </svg>
    <p class="eyebrow" id="forName">For my love</p>
    <h1>Something is waiting<br>for you</h1>

    <div class="countdown" role="timer" aria-label="Time until it opens">
      <div class="unit"><span class="num" id="d">0</span><span class="lbl">Days</span></div>
      <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
      <div class="unit"><span class="num" id="m">00</span><span class="lbl">Minutes</span></div>
      <div class="unit"><span class="num" id="s">00</span><span class="lbl">Seconds</span></div>
    </div>

    <p class="when" id="when"></p>
    <p class="hint">Don't peek — come back at midnight ♡</p>
  </section>
</main>

<script>
/* =====================================================================
   ✏️  여기만 수정하세요 (EDIT HERE)
   ===================================================================== */
const CONFIG = {
  // 열리는 시각: 세부(필리핀, UTC+8) 11월 29일 00:00  = 한국시간 01:00
  UNLOCK_AT: "2026-11-29T00:00:00+08:00",

  // 처음 알게 된 날 (기념일 계산용)  ※ 사귄 날: 2026-02-07
  START_DATE: "2025-11-29",

  // 유튜브 링크 또는 영상 ID. (예: "https://youtu.be/abcdEFGhijk")
  // 소스보기로 들키지 않게 하려면 "enc:..." 형태로 넣으세요 (README 참고).
  VIDEO: "enc:MEdWajdwUVZybWo=",

  HER_NAME: "my love",
  FROM: "",           // 예: "Yours, Minjun"

  MESSAGE: `One year ago today,
an unexpected first call
became my favorite part of every day.

We're far apart for now,
but I keep dreaming of the day
we won't need a screen to say good night.

After the rain, the sun always comes out.

I love you Gle. 사랑해.`,

  // 열리자마자 나오는 꽃 퀴즈
  QUIZ_QUESTION: "What's your<br>favorite flower?",
  QUIZ_CORRECT: "Correct!",
  QUIZ_CORRECT_SUB: "Of course I know — my little daisy 🌼",
  QUIZ_WRONG: ["Hmm… are you sure? 🤔", "Nope! Try again 😝"],
  FLOWERS: [
    { src: "images/flower-1.jpg", name: "Daisy",          pos: "50% 58%", correct: true },
    { src: "images/flower-2.jpg", name: "Cherry Blossom", pos: "45% 50%" },
    { src: "images/flower-3.jpg", name: "Tulip",          pos: "42% 50%" },
  ],
  FIELD_IMAGE: "images/field.jpg",
  // 유튜브 썸네일이 없을 때 대신 보여줄 영상 표지
  POSTER: "images/field.jpg",
};
/* ===================================================================== */

(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  // 폭죽·하트 연출이 선물의 핵심이라, 폰의 '동작 줄이기' 설정과 상관없이 항상 재생
  const reduceMotion = false;

  /* ---------- trusted clock (server Date header beats a fiddled phone clock) ---------- */
  let offset = 0;
  const now = () => Date.now() + offset;
  async function syncClock() {
    if (location.protocol === 'file:') return;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 2500);
      const t0 = Date.now();
      const res = await fetch(location.pathname + '?_t=' + t0, { method: 'HEAD', cache: 'no-store', signal: ctrl.signal });
      const t1 = Date.now();
      clearTimeout(timer);
      const server = Date.parse(res.headers.get('date') || '');
      if (!isNaN(server)) {
        const o = server + 500 + (t1 - t0) / 2 - t1;   // Date header is second-precision
        offset = Math.abs(o) > 5000 ? o : 0;          // only correct clocks that are clearly wrong
      }
    } catch (e) { /* offline or blocked: fall back to device clock */ }
  }

  /* ---------- target time (+ private preview for you) ---------- */
  let unlockAt = Date.parse(CONFIG.UNLOCK_AT);
  const preview = params.get('preview');          // ?preview=now  or  ?preview=10  (seconds)
  if (preview === 'now') unlockAt = Date.now() - 1000;
  else if (preview && /^\d+$/.test(preview)) unlockAt = Date.now() + (+preview) * 1000;

  const startAt = Date.parse(CONFIG.START_DATE + 'T00:00:00+08:00');
  const daysTogether = Math.round((Date.parse(CONFIG.UNLOCK_AT) - startAt) / 864e5);

  /* ---------- labels ---------- */
  $('forName').textContent = 'For ' + CONFIG.HER_NAME;
  const fmt = (opts) => new Intl.DateTimeFormat('en-US', opts).format(new Date(Date.parse(CONFIG.UNLOCK_AT)));
  const cebu = fmt({ timeZone: 'Asia/Manila', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  $('when').innerHTML = `Opens <b>${cebu}</b> · Philippine time`;

  /* ---------- countdown ---------- */
  const els = { d: $('d'), h: $('h'), m: $('m'), s: $('s') };
  const last = {};
  function setNum(k, v) {
    if (last[k] === v) return;
    last[k] = v;
    const el = els[k];
    el.textContent = v;
    el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
  }
  let unlocked = false, loop;
  function render() {
    const diff = unlockAt - now();
    if (diff <= 0) { if (!unlocked) unlock(); return; }
    const t = Math.floor(diff / 1000);
    setNum('d', String(Math.floor(t / 86400)));
    setNum('h', String(Math.floor(t % 86400 / 3600)).padStart(2, '0'));
    setNum('m', String(Math.floor(t % 3600 / 60)).padStart(2, '0'));
    setNum('s', String(t % 60).padStart(2, '0'));
  }

  /* ---------- video helpers ---------- */
  function decode(v) {
    v = (v || '').trim();
    if (v.startsWith('enc:')) { try { v = atob(v.slice(4)).split('').reverse().join(''); } catch (e) { v = ''; } }
    return v;
  }
  function ytId(raw) {
    const v = decode(raw);
    if (!v) return '';
    if (/^[\w-]{11}$/.test(v)) return v;
    try {
      const u = new URL(v);
      if (u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12);
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
      if (m) return m[2];
    } catch (e) {}
    return '';
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- the reveal (built only after unlock — nothing hidden in the page before) ---------- */
  function unlock() {
    unlocked = true;
    clearInterval(loop);
    ['d', 'h', 'm', 's'].forEach(k => setNum(k, k === 'd' ? '0' : '00'));
    // preload the quiz photos + flower field while the opening plays
    CONFIG.FLOWERS.forEach(f => { new Image().src = f.src; });
    new Image().src = CONFIG.FIELD_IMAGE;
    // 🌠 a shooting star flies in from the side, hits the lock and opens it → hearts → quiz
    const hint = document.querySelector('.hint');
    if (hint) hint.textContent = "It's time ♡";
    cometToLock(() => {
      $('lock').classList.add('open');
      setTimeout(() => { burst(); $('locked').classList.add('leaving'); }, 1200);
      setTimeout(showQuiz, 2000);
    });
  }

  /* ---------- "what's your favorite flower?" ---------- */
  function showQuiz() {
    $('stage').innerHTML = `
      <section class="quiz stagger" id="quiz">
        <p class="eyebrow">Before your gift…</p>
        <h1>${CONFIG.QUIZ_QUESTION}</h1>
        <p class="sub">Pick one, ${esc(CONFIG.HER_NAME)} ♡</p>
        <div class="choices" id="choices">
          ${CONFIG.FLOWERS.map((f, i) => `
            <button class="choice" data-i="${i}">
              <span class="ph"><img src="${f.src}" alt="${esc(f.name)}" style="object-position:${f.pos}"></span>
              <span class="nm">${esc(f.name)}</span>
            </button>`).join('')}
        </div>
        <div>
          <p class="fb" id="fb" aria-live="polite"></p>
          <button class="next" id="next" hidden>Open your gift ♡</button>
        </div>
      </section>`;
    window.scrollTo(0, 0);

    let tries = 0, solved = false;

  function showReveal() {

  /* ---------- starry sky ---------- */

      p: Math.random() * Math.PI * 2, sp: .6 + Math.random() * 1.6
    }));
  }
  /* ---------- 🌠 one shooting star flies in from the side and opens the lock ---------- */
  let comet = null, glints = [], ring = null;
  function cometToLock(onHit) {
    const r = $('lock').getBoundingClientRect();
    const x1 = r.left + r.width / 2, y1 = r.top + r.height * .6;   // the keyhole-ish heart
    const x0 = -90, y0 = y1 - Math.min(150, H * .17);

  function impact(x, y) {

      const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4.5;
      glints.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: .018 + Math.random() * .02,
        r: 1 + Math.random() * 1.8, c: cols[i % cols.length], drag: .94 });
    }

  function drawComet(now, k) {

  function drawSky(t) {
    sctx.clearRect(0, 0, W, H);

      sctx.globalAlpha = a;

    }
    sctx.globalAlpha = 1;
  }

  /* ---------- heart burst ---------- */
  let hearts = [];
  const colors = ['#f4a7b9', '#e46a8c', '#f6d7a7', '#ffffff', '#ffc2d1'];
  function heartPath(c, x, y, s, rot) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
    c.beginPath();
    c.moveTo(0, -.3);
    c.bezierCurveTo(0, -.6, -.5, -.6, -.5, -.3);
    c.bezierCurveTo(-.5, 0, 0, .2, 0, .45);
    c.bezierCurveTo(0, .2, .5, 0, .5, -.3);
    c.bezierCurveTo(.5, -.6, 0, -.6, 0, -.3);
    c.fill(); c.restore();
  }
  function burst() {
    if (reduceMotion) return;
    const cx = W / 2, cy = H * .42;
    for (let i = 0; i < 110; i++) {
      const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 9;
      hearts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 10 + Math.random() * 18,
        rot: Math.random() - .5, vr: (Math.random() - .5) * .15, life: 1, c: colors[i % colors.length] });
    }
    // gentle rain afterwards
    let n = 0; const rain = setInterval(() => {
      if (++n > 40) return clearInterval(rain);
      hearts.push({ x: Math.random() * W, y: -20, vx: (Math.random() - .5), vy: 1 + Math.random() * 2, s: 8 + Math.random() * 12,
        rot: Math.random() - .5, vr: (Math.random() - .5) * .05, life: 1, c: colors[n % colors.length], slow: true });
    }, 120);
  }
  /* ---------- 🎉 party poppers + confetti ---------- */
  let confetti = [], lastFx = 0;
  const confColors = ['#f4a7b9', '#e46a8c', '#f6d7a7', '#ffd27a', '#ffffff', '#a7d8f4', '#c9b6ff', '#9be3b5'];
  function shootConfetti(side) {
    const left = side === 'l', S = H / 812;
    const x0 = left ? 50 : W - 50, y0 = H * .5 - 20;                   // fired from the middle of each side
    for (let i = 0; i < 95; i++) {
      const ang = (-48 + (Math.random() - .5) * 44) * Math.PI / 180;     // up and inward
      const v = (10 + Math.random() * 10) * S;
      const r = Math.random();
      confetti.push({
        x: x0, y: y0, vx: Math.cos(ang) * v * (left ? 1 : -1), vy: Math.sin(ang) * v,
        shape: r < .55 ? 'rect' : r < .8 ? 'ribbon' : 'dot',
        w: 5 + Math.random() * 5, h: 9 + Math.random() * 8,
        rot: Math.random() * 6.3, vr: (Math.random() - .5) * .3,
        tilt: Math.random() * 6.3, vt: .08 + Math.random() * .12,
        wob: Math.random() * 6.3, maxFall: 1.4 + Math.random() * 1.8,

  }
  function partyPoppers() {
    const make = side => {
      const el = document.createElement('div');

      document.body.appendChild(el); return el;
    };
    const L = make('l'), R = make('r');
    requestAnimationFrame(() => { L.classList.add('show'); R.classList.add('show'); });

  function drawFx(now) {

      g.addColorStop(0, `rgba(255,235,205,${.14 * flash.a})`); g.addColorStop(1, 'rgba(255,235,205,0)');
      wctx.fillStyle = g; wctx.fillRect(0, 0, W, H);
      flash.a -= .1 * k; if (flash.a <= 0) flash = null;
    }
    wctx.globalCompositeOperation = 'source-over';
    if (!rockets.length && !sparks.length && !flash) wctx.clearRect(0, 0, W, H);
  }

  function frame(t) { drawSky(t); drawFx(t); drawFw(t); requestAnimationFrame(frame); }

  /* ---------- go ---------- */
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  syncClock().then(() => {
    $('locked').classList.remove('loading');
    render();
    if (!unlocked) loop = setInterval(render, 250);
  });
  // if she switches apps / changes the phone clock, re-check against the server
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !unlocked) syncClock().then(render); });
})();
</script>
</body>
</html>
